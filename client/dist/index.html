  <link rel="icon" type="image/png" href="/assets/logo-SiUukkZm.png">
  <script>
    (function() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const urlToken = urlParams.get('token');
        if (urlToken) {
          localStorage.setItem('mizaniat_admin_token', urlToken);
          localStorage.setItem('mizaniat_admin_info', JSON.stringify({ id: 2, email: 'saadm7294@gmail.com', name: 'مدير النظام' }));
          localStorage.removeItem('mizaniat_viewer_mode');
          localStorage.removeItem('mizaniat_viewer_token');
        }
        const theme = urlParams.get('theme') || localStorage.getItem('theme') || 'dark';
        if (urlParams.has('theme')) {
          try { localStorage.setItem('theme', theme); } catch(e) {}
        }
        function applyTheme() {
          if (theme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.add('light-theme');
            if (document.body) {
              document.body.classList.add('light-theme');
              document.body.setAttribute('data-theme', 'light');
            }
          } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.remove('light-theme');
            if (document.body) {
              document.body.classList.remove('light-theme');
              document.body.setAttribute('data-theme', 'dark');
            }
          }
        }
        applyTheme();
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', applyTheme);
        }
      } catch(e) {}
    })();
  </script>
